<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ログイン｜歯科資材 検収・在庫管理</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231f6feb'/%3E%3Cpath d='M9 12l7-4 7 4-7 4-7-4zm0 0v8l7 4 7-4v-8' fill='none' stroke='white' stroke-width='2' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="auth-page">
    <div class="card auth-card">
      <div class="brand"><span class="brand-mark">資</span></div>
      <h1>歯科資材 検収・在庫管理</h1>
      <p class="lead">スタッフアカウントでログインしてください</p>

      <div id="message" hidden></div>

      <form id="login-form" novalidate>
        <div class="field">
          <label for="email" class="required">メールアドレス</label>
          <input class="input" id="email" type="email" autocomplete="username" required>
        </div>
        <div class="field">
          <label for="password" class="required">パスワード</label>
          <input class="input" id="password" type="password" autocomplete="current-password" required>
        </div>
        <button class="btn btn-primary btn-block" id="login-btn" type="submit">ログイン</button>
      </form>

      <div id="demo-box" class="alert alert-info" style="margin:20px 0 0" hidden></div>

      <p class="auth-footer">※ 本システムは作品展示用です。データはすべて架空のものです。</p>
    </div>
  </div>

  <script type="module" src="js/pages/login.js"></script>
</body>
</html>
